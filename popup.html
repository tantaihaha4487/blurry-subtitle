<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurry Subtitle Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <h1>Blurry Subtitle</h1>

    <!-- Enable Toggle -->
    <div class="setting-row enable-row">
      <div class="setting-info">
        <label for="enable-toggle">Enable</label>
      </div>
      <div class="setting-controls">
        <label class="toggle-switch">
          <input type="checkbox" id="enable-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Transparency Slider -->
    <div class="setting-row">
      <div class="setting-info">
        <label for="transparency-slider">Transparency</label>
        <span class="setting-value" id="transparency-value">10%</span>
      </div>
      <div class="setting-controls">
        <button class="reset-btn" data-setting="transparency" title="Reset">↺</button>
        <input type="range" id="transparency-slider" min="0" max="100" value="10">
      </div>
    </div>

    <!-- Text Color -->
    <div class="setting-row">
      <div class="setting-info">
        <label for="text-color">Text Color</label>
      </div>
      <div class="setting-controls">
        <button class="reset-btn" data-setting="textColor" title="Reset">↺</button>
        <div class="color-preview" id="text-color-preview"></div>
        <input type="text" id="text-color" value="#ffffff" class="color-input" maxlength="7" placeholder="#ffffff">
      </div>
    </div>

    <!-- Blur Box Color -->
    <div class="setting-row">
      <div class="setting-info">
        <label for="box-color">Box Color</label>
      </div>
      <div class="setting-controls">
        <button class="reset-btn" data-setting="blurBoxColor" title="Reset">↺</button>
        <div class="color-preview" id="box-color-preview"></div>
        <input type="text" id="box-color" value="#646464" class="color-input" maxlength="7" placeholder="#646464">
      </div>
    </div>

    <!-- Reset All -->
    <button class="reset-all-btn" id="reset-all">Reset All</button>
  </div>

  <script src="popup.js"></script>
</body>

</html>
